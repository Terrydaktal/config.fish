// The first AutoConfig line must be a comment.
(() => {
  const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
  const observerService = Cc["@mozilla.org/observer-service;1"].getService(
    Ci.nsIObserverService
  );
  const ioService = Cc["@mozilla.org/network/io-service;1"].getService(
    Ci.nsIIOService
  );
  const prefService = Cc["@mozilla.org/preferences-service;1"].getService(
    Ci.nsIPrefService
  );
  const prefs = prefService.getBranch("");
  const topics = ["final-ui-startup", "browser-delayed-startup-finished"];

  const recordState = (removed, spellChecker) => {
    prefs.setBoolPref(
      "config.britishDictionary.builtInUSRemoved",
      removed
    );
    prefs.setStringPref(
      "config.britishDictionary.availableDictionaries",
      spellChecker.getDictionaryList().join(",")
    );
    prefService.savePrefFile(null);
  };

  const removeObservers = observer => {
    for (const topic of topics) {
      try {
        observerService.removeObserver(observer, topic);
      } catch {}
    }
  };

  const observer = {
    observe(_subject, topic) {
      try {
        const spellChecker = Cc[
          "@mozilla.org/spellchecker/engine;1"
        ].getService(Ci.mozISpellCheckingEngine);
        const builtInUSDictionary = ioService.newURI(
          "resource://gre/dictionaries/en-US.aff"
        );

        if (spellChecker.removeDictionary("en-US", builtInUSDictionary)) {
          recordState(true, spellChecker);
          removeObservers(this);
          return;
        }

        // Retry once after the first browser window finishes starting in case
        // the built-in dictionaries were registered after final-ui-startup.
        if (topic === "browser-delayed-startup-finished") {
          recordState(false, spellChecker);
          removeObservers(this);
          Cu.reportError("Failed to unregister Firefox's built-in en-US dictionary");
        }
      } catch (error) {
        removeObservers(this);
        Cu.reportError(error);
      }
    },
  };

  for (const topic of topics) {
    observerService.addObserver(observer, topic);
  }
})();
